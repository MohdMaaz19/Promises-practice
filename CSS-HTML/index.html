<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Pricing</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <h1>Our Pricing</h1>
        <div class="plan-type">
            <p>Anual</p>
            <p>Monthly</p>
        </div>
        <div class="card-container">
            <div class="left-card card">
                <h2>Basic</h2>
                <p class="price">$ 19.99</p>
                <hr>
                <p>500 GB</p>
                <hr>
                <p>2 Users Allowed</p>
                <hr>
                <p>Send upto 3GB</p>
                <hr>
                <button>LEARN MORE</button>
            </div>
            <div class="center-card card" >
                <h2>Professional</h2>
                <p class="price">$ 24.99</p>
                <hr>
                <p>1 TB</p>
                <hr>
                <p>5 Users Allowed</p>
                <hr>
                <p>Send upto 10GB</p>
                <hr>
                <button>LEARN MORE</button>
            </div>
            <div class="right-card card">
                <h2>Master</h2>
                <p class="price">$ 39.99</p>
                <hr>
                <p>2 TB</p>
                <hr>
                <p>10 Users Allowed</p>
                <hr>
                <p>Send upto 20GB</p>
                <hr>
                <button>LEARN MORE</button>
            </div>
        </div>
    </main>
</body>
</html>
